name: sentinel-x

# Stack serveur SENTINEL-X : base PostgreSQL, broker Mosquitto (MQTTS), API FastAPI, Nginx (HTTPS).
# Premier lancement : voir README.md (génération des certificats avec le service "setup").

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  setup:
    image: alpine:3.20
    profiles: [ "setup" ]
    env_file: .env
    volumes:
      - ./tools/setup.sh:/setup.sh:ro
      - ./certs:/out/certs
      - ./mosquitto/config:/out/mosquitto
    entrypoint: [ "sh", "/setup.sh" ]

  db:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?à définir dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [ backend ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sentinel_admin -d sentinel" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/server.key:/mosquitto/certs/server.key:ro
      - mosquitto-data:/mosquitto/data
    networks: [ backend ]

  api:
    <<: *hardening
    build: ./api
    environment:
      DATABASE_URL: postgresql://sentinel_app:${DB_APP_PASSWORD}@db:5432/sentinel
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?à définir dans .env}
      MQTT_CA: /certs/ca.crt
      INGEST_TOKEN: ${INGEST_TOKEN:?à définir dans .env}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?à définir dans .env}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks: [ backend ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]

  nginx:
    <<: *hardening
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      STREAM_TOKEN: ${STREAM_TOKEN:?à définir dans .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports:
      - "443:8443"
      - "80:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
      - ./certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    depends_on:
      - api
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL

  vision:
    <<: *hardening
    build: ./vision
    profiles: ["vision"]
    environment:
      CAMERA: tcp://host.docker.internal:1235
      API_URL: https://nginx:8443/api/v1/alerts
      API_TOKEN: ${INGEST_TOKEN:?à définir dans .env}
      CA_CERT: /certs/ca.crt
      STREAM_TOKEN: ${STREAM_TOKEN:?à définir dans .env}
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      IMGSZ: "320"
      JPEG_QUALITY: "60"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - ./vision/logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [nginx]
    networks: [backend]
    cap_drop: [ALL]

networks:
  backend: { }

volumes:
  db-data: { }
  mosquitto-data: { }