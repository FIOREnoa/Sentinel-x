# Point d'entrée HTTPS unique : dashboard, API, WebSocket et flux caméra

# Limite les tentatives de connexion au dashboard : 5 par minute et par adresse
limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
# Limite le reste de l'API : 20 requêtes par seconde et par adresse
limit_req_zone  $binary_remote_addr zone=api:10m rate=20r/s;
# Compte les connexions ouvertes par adresse
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 8080;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_tokens off;

    # Contre la saturation par un seul client : 20 connexions simultanées par adresse,
    # et coupure des clients qui envoient leur requête trop lentement (slowloris)
    limit_conn perip 20;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    client_max_body_size 512k;

    # DNS interne de Docker, pour joindre le conteneur vision au moment de la requête
    # (nginx démarre même si la vision est désactivée)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Jeton du flux vidéo : écrit au démarrage par l'image nginx à partir de STREAM_TOKEN
    # (nginx/templates/camera_token.conf.template). Il ne quitte jamais le serveur.
    set $stream_token "";
    include /tmp/camera_token*.conf;

    # Dashboard (fichiers statiques construits par le Dockerfile)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Connexion au dashboard : limitée contre les essais de jetons en série
    location = /api/v1/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        limit_req zone=api burst=40 nodelay;
    }

    # WebSocket temps réel (authentifié par le cookie de session)
    location /ws {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Vérification de la session, utilisée par le flux caméra
    location = /_auth {
        internal;
        proxy_pass http://api:8000/api/v1/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Flux vidéo de la caméra : réservé aux personnes connectées au dashboard.
    # nginx ajoute lui-même le jeton du flux, qui n'apparaît jamais dans le navigateur.
    location = /camera/stream {
        auth_request /_auth;
        access_log off;

        proxy_pass https://vision:8000/stream?token=$stream_token;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;

        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
